[preset: nucleus_linux_target_runtime]
release
no-assertions
no-swift-stdlib-assertions
test=0
validation-test=0
long-test=0
stress-test=0
build-ninja
skip-build-cmark
skip-build-llvm
skip-build-benchmarks
skip-test-cmark
skip-local-build
build-swift-tools=0
build-swift-libexec=0
skip-early-swift-driver
skip-early-swiftsyntax
native-swift-tools-path=%(toolchain_path)s
native-llvm-tools-path=%(toolchain_path)s
native-clang-tools-path=%(toolchain_path)s
cross-compile-hosts=linux-%(target_architecture)s
cross-compile-build-swift-tools=0
cross-compile-deps-path=/target-sysroot
cross-compile-append-host-target-to-destdir=0
stdlib-deployment-targets=linux-%(target_architecture)s
build-stdlib-deployment-targets=linux-%(target_architecture)s
build-swift-static-stdlib=1
build-swift-static-sdk-overlay=1
build-swift-stdlib-unittest-extra=0
foundation
libdispatch
xctest
install-swift
install-foundation
install-libdispatch
install-xctest
swift-install-components=clang-builtin-headers;license;stdlib;sdk-overlay
install-prefix=/usr
install-destdir=%(install_destdir)s
skip-clean-libdispatch
skip-clean-foundation
skip-clean-xctest
extra-cmake-options=
    -DCMAKE_SYSTEM_NAME:STRING=Linux
    -DCMAKE_SYSTEM_PROCESSOR:STRING=%(target_architecture)s
    -DCMAKE_SYSROOT:PATH=/target-sysroot
    -DCMAKE_Swift_COMPILER:FILEPATH=/runtime-builder/nucleus-target-swiftc
    -DCMAKE_C_COMPILER_TARGET:STRING=%(target_triple)s
    -DCMAKE_CXX_COMPILER_TARGET:STRING=%(target_triple)s
    -DCMAKE_Swift_COMPILER_TARGET:STRING=%(target_triple)s
    -DCMAKE_Swift_COMPILER_WORKS:BOOL=TRUE
    -DCMAKE_C_FLAGS:STRING=--target=%(target_triple)s\ --sysroot=/target-sysroot\ -fuse-ld=lld\ -Wno-unused-command-line-argument
    -DCMAKE_CXX_FLAGS:STRING=--target=%(target_triple)s\ --sysroot=/target-sysroot\ -stdlib=libc++\ -fuse-ld=lld\ -L/target-sysroot/usr/lib/%(target_gnu_architecture)s\ -Wno-unused-command-line-argument
    -DCMAKE_Swift_FLAGS:STRING=-resource-dir\ /build/Ninja-Release/swift-linux-%(target_architecture)s/lib/swift\ -sdk\ /target-sysroot\ -module-cache-path\ /build/Ninja-Release/swift-linux-%(target_architecture)s/module-cache
    -DCMAKE_EXE_LINKER_FLAGS:STRING=-fuse-ld=lld
    -DCMAKE_SHARED_LINKER_FLAGS:STRING=-fuse-ld=lld
    -DCMAKE_MODULE_LINKER_FLAGS:STRING=-fuse-ld=lld
    -DLLVM_DIR:PATH=/usr/lib/llvm-21/lib/cmake/llvm
    -DClang_DIR:PATH=/usr/lib/llvm-21/lib/cmake/clang
    -DLLVM_BUILD_LIBRARY_DIR:PATH=/usr/lib/llvm-21/lib
    -DLLVM_ENABLE_LIBXML2:BOOL=FALSE
    -DCLANG_ENABLE_LIBXML2:BOOL=FALSE
    -DSWIFT_ENABLE_LIBXML2:BOOL=FALSE
extra-swift-cmake-options=
    -DSWIFT_USE_LINKER:STRING=lld
    -DSWIFT_SDK_LINUX_ARCH_%(target_architecture)s_PATH:PATH=/target-sysroot
    -DSWIFT_SHOULD_BUILD_EMBEDDED_STDLIB:BOOL=FALSE
    -DSWIFT_STDLIB_INSTALL_ONLY_CLANG_RESOURCE_HEADERS:BOOL=TRUE
    -DSWIFT_STDLIB_EXTRA_C_COMPILE_FLAGS:STRING=-stdlib=libc++
    -DSWIFT_STDLIB_EXTRA_SWIFT_COMPILE_FLAGS:STRING=-Xcc;-stdlib=libc++
foundation-cmake-options=
    -DCMAKE_C_FLAGS:STRING=--target=%(target_triple)s;--sysroot=/target-sysroot
    -DCMAKE_CXX_FLAGS:STRING=--target=%(target_triple)s;--sysroot=/target-sysroot;-stdlib=libc++
    -DLIBXML2_INCLUDE_DIR:PATH=/build/libxml2-install-linux-%(target_architecture)s/usr/include/libxml2
    -DLIBXML2_LIBRARY:FILEPATH=/build/libxml2-install-linux-%(target_architecture)s/usr/lib/%(target_gnu_architecture)s/libxml2.so
libdispatch-cmake-options=
    -DCMAKE_C_FLAGS:STRING=--target=%(target_triple)s;--sysroot=/target-sysroot
    -DCMAKE_CXX_FLAGS:STRING=--target=%(target_triple)s;--sysroot=/target-sysroot;-stdlib=libc++
