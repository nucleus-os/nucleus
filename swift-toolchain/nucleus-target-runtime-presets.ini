[preset: nucleus_linux_x86_64_runtime]
release
no-assertions
no-swift-stdlib-assertions
test=0
validation-test=0
long-test=0
stress-test=0
build-ninja
skip-build-cmark
skip-build-llvm
skip-build-benchmarks
skip-test-cmark
skip-local-build
build-swift-tools=0
build-swift-libexec=0
skip-early-swift-driver
skip-early-swiftsyntax
native-swift-tools-path=%(toolchain_path)s
native-llvm-tools-path=%(toolchain_path)s
native-clang-tools-path=%(toolchain_path)s
cross-compile-hosts=linux-x86_64
cross-compile-build-swift-tools=0
cross-compile-deps-path=/usr/x86_64-linux-gnu
cross-compile-append-host-target-to-destdir=0
stdlib-deployment-targets=linux-x86_64
build-stdlib-deployment-targets=linux-x86_64
build-swift-static-stdlib=1
build-swift-static-sdk-overlay=1
build-swift-stdlib-unittest-extra=0
foundation
libdispatch
xctest
swift-testing
install-swift
install-foundation
install-libdispatch
install-xctest
install-swift-testing
swift-install-components=clang-builtin-headers;license;stdlib;sdk-overlay
install-prefix=/usr
install-destdir=%(install_destdir)s
skip-clean-libdispatch
skip-clean-foundation
skip-clean-xctest
extra-cmake-options=
    -DCMAKE_SYSTEM_NAME:STRING=Linux
    -DCMAKE_SYSTEM_PROCESSOR:STRING=x86_64
    -DCMAKE_SYSROOT:PATH=/usr/x86_64-linux-gnu
    -DCMAKE_Swift_COMPILER:FILEPATH=/usr/local/bin/nucleus-x86_64-swiftc
    -DCMAKE_C_COMPILER_TARGET:STRING=x86_64-unknown-linux-gnu
    -DCMAKE_CXX_COMPILER_TARGET:STRING=x86_64-unknown-linux-gnu
    -DCMAKE_Swift_COMPILER_TARGET:STRING=x86_64-unknown-linux-gnu
    -DCMAKE_Swift_COMPILER_WORKS:BOOL=TRUE
    -DCMAKE_C_FLAGS:STRING=--target=x86_64-unknown-linux-gnu\ --sysroot=/usr/x86_64-linux-gnu
    -DCMAKE_CXX_FLAGS:STRING=--target=x86_64-unknown-linux-gnu\ --sysroot=/usr/x86_64-linux-gnu\ -stdlib=libc++
    -DCMAKE_Swift_FLAGS:STRING=-resource-dir\ /build/Ninja-Release/swift-linux-x86_64/lib/swift\ -sdk\ /usr/x86_64-linux-gnu\ -module-cache-path\ /build/Ninja-Release/swift-linux-x86_64/module-cache
    -DCMAKE_EXE_LINKER_FLAGS:STRING=-fuse-ld=lld
    -DCMAKE_SHARED_LINKER_FLAGS:STRING=-fuse-ld=lld
    -DCMAKE_MODULE_LINKER_FLAGS:STRING=-fuse-ld=lld
extra-swift-cmake-options=
    -DSWIFT_USE_LINKER:STRING=lld
    -DSWIFT_SDK_LINUX_ARCH_x86_64_PATH:PATH=/usr/x86_64-linux-gnu
    -DSWIFT_SHOULD_BUILD_EMBEDDED_STDLIB:BOOL=FALSE
    -DSWIFT_STDLIB_EXTRA_C_COMPILE_FLAGS:STRING=-stdlib=libc++
    -DSWIFT_STDLIB_EXTRA_SWIFT_COMPILE_FLAGS:STRING=-Xcc;-stdlib=libc++
foundation-cmake-options=
    -DCMAKE_C_FLAGS:STRING=--target=x86_64-unknown-linux-gnu;--sysroot=/usr/x86_64-linux-gnu
    -DCMAKE_CXX_FLAGS:STRING=--target=x86_64-unknown-linux-gnu;--sysroot=/usr/x86_64-linux-gnu;-stdlib=libc++
libdispatch-cmake-options=
    -DCMAKE_C_FLAGS:STRING=--target=x86_64-unknown-linux-gnu;--sysroot=/usr/x86_64-linux-gnu
    -DCMAKE_CXX_FLAGS:STRING=--target=x86_64-unknown-linux-gnu;--sysroot=/usr/x86_64-linux-gnu;-stdlib=libc++
