[binaries]
c = ['/usr/bin/clang', '--target=x86_64-unknown-linux-gnu', '--sysroot=/swift-sdk/nucleus-swift-6.4-linux.artifactbundle/swift-linux/x86_64-unknown-linux-gnu/nucleus-linux-glibc-2.38.sdk']
ar = '/usr/bin/llvm-ar'
strip = '/usr/bin/llvm-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '/swift-sdk/nucleus-swift-6.4-linux.artifactbundle/swift-linux/x86_64-unknown-linux-gnu/nucleus-linux-glibc-2.38.sdk'
pkg_config_libdir = ['/usr/lib/x86_64-linux-gnu/pkgconfig', '/usr/share/pkgconfig']

[built-in options]
c_args = ['-idirafter/usr/include', '-idirafter/usr/include/x86_64-linux-gnu']
c_link_args = ['-fuse-ld=lld', '-L/usr/lib/x86_64-linux-gnu']
