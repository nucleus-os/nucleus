[binaries]
c = ['clang', '--target=x86_64-unknown-linux-gnu', '--sysroot=/swift-sdk/nucleus-swift-6.4-linux.artifactbundle/swift-linux/x86_64-unknown-linux-gnu/nucleus-linux-glibc-2.38.sdk']
cpp = ['clang++', '--target=x86_64-unknown-linux-gnu', '--sysroot=/swift-sdk/nucleus-swift-6.4-linux.artifactbundle/swift-linux/x86_64-unknown-linux-gnu/nucleus-linux-glibc-2.38.sdk']
ar = '/opt/swift/usr/bin/llvm-ar'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
sys_root = '/swift-sdk/nucleus-swift-6.4-linux.artifactbundle/swift-linux/x86_64-unknown-linux-gnu/nucleus-linux-glibc-2.38.sdk'
pkg_config_libdir = ['/usr/lib/x86_64-linux-gnu/pkgconfig', '/usr/share/pkgconfig']

[built-in options]
c_args = ['-idirafter/usr/include', '-idirafter/usr/include/x86_64-linux-gnu']
cpp_args = ['-stdlib=libc++', '-nostdinc++', '-isystem/swift-sdk/nucleus-swift-6.4-linux.artifactbundle/swift-linux/x86_64-unknown-linux-gnu/nucleus-linux-glibc-2.38.sdk/usr/include/c++/v1', '-idirafter/usr/include', '-idirafter/usr/include/x86_64-linux-gnu']
c_link_args = ['-fuse-ld=lld', '-L/swift-sdk/nucleus-swift-6.4-linux.artifactbundle/swift-linux/x86_64-unknown-linux-gnu/nucleus-linux-glibc-2.38.sdk/usr/lib/x86_64-linux-gnu']
cpp_link_args = ['-stdlib=libc++', '-fuse-ld=lld', '-L/swift-sdk/nucleus-swift-6.4-linux.artifactbundle/swift-linux/x86_64-unknown-linux-gnu/nucleus-linux-glibc-2.38.sdk/usr/lib/x86_64-linux-gnu']
