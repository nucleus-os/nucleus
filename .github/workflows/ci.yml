name: protected-main-verification

on:
  push:
    branches:
      - main
    # Documentation has its own GitHub-hosted validation workflow. Suppressing
    # a docs-only heavy run is what prevents it from joining this concurrency
    # group and cancelling useful M2 Ultra work already in flight. Any path not
    # ignored here, including a source path in a mixed push, still runs the
    # complete protected-main graph.
    paths-ignore:
      - '**/*.md'
      - 'docs/**/*.txt'
  workflow_dispatch:
    inputs:
      revision:
        description: Exact protected main commit to verify
        required: true
        type: string

permissions:
  contents: read

# Protected main has one tip and the machine has one execution admission, so
# only the newest revision is worth running: a superseded one holds the
# admission the run that replaced it is waiting for, and reports on a commit
# nobody is on. Every admitted non-documentation push therefore shares one group
# and cancels the run in flight. Documentation-only pushes never instantiate
# this workflow and cannot enter its concurrency group. Keying this on the
# revision made the group per-commit, so it only ever cancelled a duplicate of
# the same commit and never a superseded one.
#
# A dispatch keeps its own per-revision group. It names an exact ancestor
# deliberately, which is how a revision a supersession skipped is verified after
# the fact, so it must neither cancel the tip's run nor be cancelled by it.
concurrency:
  group: protected-main-verification-${{ github.event_name == 'workflow_dispatch' && format('revision-{0}', inputs.revision) || 'push' }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.admit.outputs.revision }}
    steps:
      - name: Admit an exact protected main revision
        id: admit
        shell: bash
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          expected_repository='nucleus-os/nucleus'
          expected_ref='refs/heads/main'
          expected_workflow_ref="${expected_repository}/.github/workflows/ci.yml@${expected_ref}"

          test "${GITHUB_REPOSITORY}" = "${expected_repository}"
          test "${GITHUB_REF}" = "${expected_ref}"
          test "${WORKFLOW_REF}" = "${expected_workflow_ref}"

          case "${GITHUB_EVENT_NAME}" in
            push)
              revision="${GITHUB_SHA}"
              ;;
            workflow_dispatch)
              revision="${REQUESTED_REVISION}"
              ;;
            *)
              exit 1
              ;;
          esac

          if [[ ! "${revision}" =~ ^[0-9a-f]{40}$ ]]; then
            exit 1
          fi

          comparison="$(
            curl --fail-with-body --silent --show-error --location \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/compare/${revision}...main"
          )"
          merge_base="$(
            printf '%s' "${comparison}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["merge_base_commit"]["sha"])'
          )"
          test "${merge_base}" = "${revision}"

          printf 'revision=%s\n' "${revision}" >> "${GITHUB_OUTPUT}"

  verify:
    needs: admission
    runs-on:
      group: nucleus
      labels: nucleus-m2-ultra
    # A job that sets no timeout gets GitHub's 360-minute default, which is
    # unrelated to the runner being self-hosted and is far shorter than a cold
    # sweep. The sweep contains four Chromium-scale builds -- browser and CEF,
    # each for x86_64 and arm64 -- and the shared source lock runs them one at
    # a time, which is deliberate: each gets the whole machine. Measured on
    # 2026-09-02, they were 4h04m, 4h08m, and a CEF build still going at 3h38m,
    # against under nine minutes for every artifact and packaging task
    # combined. A cold sweep is therefore about seventeen hours.
    #
    # Nothing here should normally be cold. This bounds the case where
    # everything is, so raising it is not the answer to a sweep that got slower.
    timeout-minutes: 1200
    env:
      NUCLEUS_PRODUCT_SOURCE_AUTHORITY: protected-main
      NUCLEUS_PRODUCT_SOURCE_COMMIT: ${{ needs.admission.outputs.revision }}
      NUCLEUS_PRODUCT_SOURCE_REF: refs/heads/main
      NUCLEUS_PRODUCT_PRODUCER_TRUST_DOMAIN: nucleus-builder
    steps:
      - name: Check out the admitted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags are structurally required; shallowing this
          # is a known trap. Provenance capture itself reads only the
          # checked-out tree, while Collider resolves forked SwiftPM sources
          # from immutable public revisions. Submodule repositories are source
          # and provenance inputs, not Git remotes for package resolution.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admission.outputs.revision }}
          submodules: recursive
      - name: Begin diagnostic capture
        id: diagnostics
        run: python3 tools/ci-diagnostics.py begin
      - name: Verify diagnostic export boundaries
        run: python3 tools/ci-diagnostics-test.py
      - name: Verify runner and checkout ownership
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner-user=%s runner-uid=%s\n' "$(id -un)" "$(id -u)"
          printf 'checkout-owner=%s checkout-uid=%s\n' \
            "$(stat -f '%Su' "${GITHUB_WORKSPACE}")" \
            "$(stat -f '%u' "${GITHUB_WORKSPACE}")"
          test "$(id -un)" = nucleus-builder
          test "$(stat -f '%Su' "${GITHUB_WORKSPACE}")" = nucleus-builder
      - name: Verify the builder host contract
        run: collider doctor ci-macos-builder
      - name: Verify protected main provenance
        run: collider check protected-main-source
      - name: Verify the catalog
        env:
          # Report directly from the runtime even when macOS produces no IPS.
          # Disable interaction and register dumps; bound unwinding and output.
          SWIFT_BACKTRACE: enable=yes,interactive=no,color=no,registers=none,images=all,threads=all,sanitize=yes,limit=128,timeout=20,output-to=${{ steps.diagnostics.outputs.backtrace }}
        run: collider verify all
      # Never invoke Collider to recover from a Collider crash. Preserve the
      # verification outcome even if diagnostic collection itself fails.
      - name: Collect this attempt's diagnostics
        if: ${{ always() && steps.diagnostics.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          DIAGNOSTIC_JOB_STATUS: ${{ job.status }}
        run: python3 tools/ci-diagnostics.py collect
      - name: Upload this attempt's diagnostics
        if: ${{ always() && steps.diagnostics.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: collider-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diagnostics.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
