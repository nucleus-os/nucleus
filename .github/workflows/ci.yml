name: monorepo-ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: monorepo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate changed-file whitespace
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_REVISION" HEAD
      - name: Validate submodule declarations
        run: git config --file .gitmodules --get-regexp '^submodule\..*\.path$'
